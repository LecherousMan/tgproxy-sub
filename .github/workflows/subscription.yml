name: Update Base64 subscription

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: subscription-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch, merge and validate subscriptions
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import html
          import re
          import time
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from urllib.request import Request, urlopen

          sources = [
              {
                  'url': 'https://tgproxy.pink/zh/keys/',
                  'host': 'tgproxy.pink',
                  'schemes': {'vless', 'trojan', 'hysteria2', 'hy2'},
              },
              {
                  'url': 'https://freevpnkeys.com/sub/protocol/hysteria2',
                  'host': 'freevpnkeys.com',
                  'schemes': {'hysteria2', 'hy2'},
              },
          ]
          pattern = re.compile(r'''(?:vless|trojan|hysteria2|hy2)://[^\s<>"'\x60]+''', re.I)
          encoded = re.compile(r'''(?:vless|trojan|hysteria2|hy2)%3A%2F%2F[^\s<>"'\x60]+''', re.I)
          limit = 8 * 1024 * 1024

          def fetch_source(source):
              request = Request(
                  source['url'],
                  headers={
                      'User-Agent': 'Mozilla/5.0 (compatible; tgproxy-sub/1.0)',
                      'Accept': 'text/plain,text/html,application/octet-stream,*/*',
                  },
              )
              with urlopen(request, timeout=30) as response:
                  final_host = (urlsplit(response.geturl()).hostname or '').lower()
                  if final_host != source['host']:
                      raise ValueError('Unexpected redirect host')
                  data = response.read(limit + 1)
                  if len(data) > limit:
                      raise ValueError('Source exceeded size limit')

              text = data.decode('utf-8-sig', errors='replace').strip()
              # Some subscription endpoints return Base64 while others return URI text.
              compact = re.sub(r'\s+', '', text)
              if compact and re.fullmatch(r'[A-Za-z0-9+/=_-]+', compact):
                  try:
                      padded = compact.replace('-', '+').replace('_', '/')
                      padded += '=' * (-len(padded) % 4)
                      decoded = base64.b64decode(padded, validate=True).decode('utf-8', errors='ignore')
                      if '://' in decoded:
                          text = decoded
                  except (binascii.Error, ValueError):
                      pass

              text = html.unescape(text)
              candidates = pattern.findall(text)
              candidates += [unquote(value) for value in encoded.findall(text)]
              nodes = {}
              for node in candidates:
                  try:
                      parsed = urlsplit(node)
                      scheme = parsed.scheme.lower()
                      if scheme not in source['schemes'] or not parsed.hostname or not parsed.username:
                          continue
                      parsed.port
                  except ValueError:
                      continue
                  normalized_scheme = 'hysteria2' if scheme == 'hy2' else scheme
                  node = normalized_scheme + node[node.index(':'):]
                  nodes.setdefault(node.partition('#')[0], node)
              if not nodes:
                  raise ValueError('No valid supported node links found')
              return list(nodes.values())

          merged = {}
          failures = []
          for source in sources:
              for attempt in range(3):
                  try:
                      found = fetch_source(source)
                      for node in found:
                          merged.setdefault(node.partition('#')[0], node)
                      print(f"Fetched {len(found)} nodes from {source['host']}.", flush=True)
                      break
                  except (OSError, ValueError) as error:
                      print(f"Fetch failed for {source['host']} on attempt {attempt + 1}: {type(error).__name__}", flush=True)
                      if attempt == 2:
                          failures.append(source['host'])
                      else:
                          time.sleep(5 * (attempt + 1))

          if not merged:
              raise SystemExit('No valid nodes fetched; keeping the previous GitHub Pages deployment.')
          if failures:
              print('Warning: source unavailable: ' + ', '.join(failures), flush=True)

          output = Path('public')
          output.mkdir()
          payload = ('\n'.join(merged.values()) + '\n').encode('utf-8')
          (output / 'sub.txt').write_bytes(base64.b64encode(payload) + b'\n')
          (output / '.nojekyll').touch()
          print(f'Prepared {len(merged)} unique nodes total.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
